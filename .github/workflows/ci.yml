name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build producer spark-streaming