[project]
name = "realtime-market-data-pipeline"
version = "0.1.0"
description = "Real-time crypto market data pipeline: Kafka, Spark Structured Streaming, TimescaleDB and Grafana"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sinks", "transformations", "producer"]